services:
  postgres:
    image: postgres:16-alpine
    container_name: kame-finance-postgres
    restart: unless-stopped
    ports:
      # Host port 5434 keeps 5432/5433 free for other local Postgres instances.
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kame_finance
    volumes:
      - kame_finance_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kame_finance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kame_finance_pgdata:
