name: CI

# Quality gate for branches and PRs. CD reuses it via workflow_call before
# migrating and deploying main.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      SKIP_ENV_VALIDATION: "1"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kame_finance
      AUTH_SECRET: ci-test-auth-secret-at-least-32-characters-long
      NEXT_PUBLIC_APP_URL: http://localhost:3005
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: .
      - name: Type check
        run: bun run type-check
      - name: Unit tests
        run: bun run test
      - name: Production build
        run: bun run build
